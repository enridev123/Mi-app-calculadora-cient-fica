body {

.container {
    padding: 60px 20px;
}

h1 {
    font-size: 40px;

    padding: 20px;
    margin: 30px auto;
    border-radius: 20px;
    max-width: 400px;

.btn {

    padding: 15px 25px;

    font-weight: bold;
    border-radius: 12px;

.btn:hover {
